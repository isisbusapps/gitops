name: Check Kubernetes YAMLs with kube-linter

on:
  # Note that both `push` and `pull_request` triggers should be present for GitHub to consistently present kube-linter
  # SARIF reports.
  push:
    branches: [ test-branch-kube-lint ]

permissions:
  contents: read
  packages: read

jobs:
  scan:
    runs-on: fase-self-hosted
    container: ghcr.io/isisbusapps/fase-gh-runner-container:latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Scan with KubeLinter Action
        uses: stackrox/kube-linter-action@v1
        id: kube_linter_scan
        continue-on-error: true # Allows us to scrub and log findings before failing the workflow
        with:
          directory: .
          format: plain
          output-file: kube-linter.log

      - name: Redact and Stream to Console Log
        run: |
            cat kube-linter.log

      - name: Enforce Linter Status
        run: |
          if [ "${{ steps.kube_linter_scan.outcome }}" != "success" ]; then
            exit 1
          fi