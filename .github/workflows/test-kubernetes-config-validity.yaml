name: Test kubernetes config validity

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    paths:
      - 'components/**/base/**/*'
      - 'components/**/overlays/**/*'

jobs:
  test_configs:
    name: Test kubernetes configs
    runs-on: fase-self-hosted-dind
    steps:
    - name: Checkout repo
      uses: actions/checkout@v7

    - name: Setup Kubectl
      uses: azure/setup-kubectl@v5

    - name: Load dev kubeconfig
      uses: azure/k8s-set-context@v5
      with:
        method: kubeconfig
        kubeconfig: ${{ secrets.DEV_ISIS_KUBECONFIG }}
        # The secrets are stored in base64.
        kubeconfig-encoding: base64

    - name: Test dev kubernetes configs
      # Excludes argocd, as that is an incomplete base requiring external config
      run: |
        for devOverlay in $(ls -d components/*/*/overlays/dev | grep -v argocd); do
          echo "-----------------"
          echo "Testing config in $devOverlay"
          kubectl apply -k "$devOverlay" --dry-run=client
          if [ "$?" -ne "0" ]; then
            echo "Verification error in $devOverlay"
            ! break
          fi
        done

    - name: Load prod kubeconfig
      uses: azure/k8s-set-context@v5
      with:
        method: kubeconfig
        kubeconfig: ${{ secrets.PROD_ISIS_KUBECONFIG }}
        kubeconfig-encoding: base64

    - name: Test prod kubernetes configs
      # Excludes argocd, as that is an incomplete base requiring external config
      run: |
        for prodOverlay in $(ls -d components/*/*/overlays/prod | grep -v argocd); do
          echo "-----------------"
          echo "Testing config in $prodOverlay"
          kubectl apply -k "$prodOverlay" --dry-run=client
          if [ "$?" -ne "0" ]; then
            echo "Verification error in $prodOverlay"
            ! break
          fi
        done
