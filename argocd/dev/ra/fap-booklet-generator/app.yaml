apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: fap-booklet-generator
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
  - clusters:
      selector:
        matchLabels:
          appEnvironment: dev
  ignoreApplicationDifferences:
    - jsonPointers:
        - /spec/syncPolicy
  template:
    metadata:
      name: '{{.name}}-fap-booklet-generator'
    spec:
      project: r-a-project
      source:
        path: components/ra/fap-booklet-generator/overlays/dev
        repoURL: 'https://github.com/isisbusapps/fap-booklet-generator'
        targetRevision: develop
      destination:
        namespace: apps
        name: '{{.name}}'
      syncPolicy:
        automated:
          selfHeal: true #https://argo-cd.readthedocs.io/en/stable/user-guide/auto_sync/#automatic-self-healing