apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: settings-tool
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
  - clusters:
      selector:
        matchLabels:
          appEnvironment: dev
  ignoreApplicationDifferences:
    - jsonPointers:
        - /spec/syncPolicy
  template:
    metadata:
      name: '{{.name}}-settings-tool'
    spec:
      project: r-a-project
      source:
        path: components/ra/settings-tool/overlays/dev
        repoURL: 'https://github.com/isisbusapps/gitops'
        targetRevision: develop
      destination:
        namespace: apps
        name: '{{.name}}'
      syncPolicy:
        automated:
          selfHeal: true #https://argo-cd.readthedocs.io/en/stable/user-guide/auto_sync/#automatic-self-healing