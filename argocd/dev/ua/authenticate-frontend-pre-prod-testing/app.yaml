apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: authenticate-frontend-pre-prod-testing
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
  - list:
      elements:
        # Names of clusters to deploy the app to
        - name: dev-v3
        # Uncomment if you want to deploy to dev-microk8s-alternative
        #- name: dev-microk8s-alternative
  template:
    metadata:
      name: '{{.name}}-authenticate-frontend-pre-prod-testing'
      annotations:
        argocd.argoproj.io/sync-wave: "0"

    spec:
      project: u-a-project
      source:
        path: components/ua/authenticate-frontend-pre-prod-testing/overlays/dev
        repoURL: 'https://github.com/isisbusapps/gitops'
        targetRevision: main
      destination:
        namespace: apps
        name: '{{.name}}'
      syncPolicy:
        automated: 
          selfHeal: true
