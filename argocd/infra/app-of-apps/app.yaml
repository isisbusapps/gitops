apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: app-of-apps-fase-infra
  namespace: argocd
spec:
  project: infrastructure-project
  source:
    path: argocd/infra
    repoURL: https://github.com/isisbusapps/gitops
    targetRevision: AddInfraVaultOperator
    directory:
      recurse: true
  destination:
    namespace: argocd
    server: https://kubernetes.default.svc
  syncPolicy:
    automated: {}