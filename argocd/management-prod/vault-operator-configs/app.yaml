apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: management-prod-vault-operator-config
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-100"
spec:
    project: infrastructure-project
    source:
      path: components/infra/vault-config-management-prod
      repoURL: 'https://github.com/isisbusapps/gitops'
      targetRevision: main
    destination:
      namespace: alloy
      server: https://kubernetes.default.svc
    syncPolicy:
      syncOptions:
        - CreateNamespace=true
      automated:
        selfHeal: true