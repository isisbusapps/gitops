apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: user-claims-frontend
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
  - clusters:
      selector:
        matchLabels:
          appEnvironment: prod
  template:
    metadata:
      name: '{{.name}}-user-claims-frontend'
    spec:
      project: r-a-project
      source:
        path: components/ra/user-claims-frontend/overlays/prod
        repoURL: 'https://github.com/isisbusapps/gitops'
        targetRevision: main
      destination:
        namespace: apps
        name: '{{.name}}'
      ignoreDifferences:
        - group: apps
          kind: Deployment
          jqPathExpressions:
            - .spec.template.spec.containers[0].image
      syncPolicy:
        automated: {}