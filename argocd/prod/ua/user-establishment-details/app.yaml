apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: user-establishment-details
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
  - list:
      elements:
        # Names of clusters to deploy the app to.
        - name: prod-v4
        - path: prod-v4
        # Uncomment if you want to deploy to prod-fallback
        - name: prod-fallback
        - path: prod-v4
        - name: prod-proxmox
        - path: prod-proxmox
  template:
    metadata:
      name: '{{.name}}-user-establishment-details'
      annotations:
        argocd.argoproj.io/sync-wave: "0"
    spec:
      project: u-a-project
      source:
        path:  components/ua/user-establishment-details/overlays/{{path}}
        repoURL: 'https://github.com/isisbusapps/gitops'
        targetRevision: main
      destination:
        namespace: apps
        name: '{{.name}}'
      syncPolicy:
        automated:
          selfHeal: true