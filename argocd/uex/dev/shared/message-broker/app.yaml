apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: rmq-message-broker
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
  - list:
      elements:
        # Names of clusters to deploy the app to
        - name: dev-v3
        # Uncomment if you want to deploy to dev-microk8s-alternative
        #- name: dev-microk8s-alternative
  template:
    metadata:
      name: '{{.name}}-rmq-message-broker'
      annotations:
        argocd.argoproj.io/sync-wave: "0"        
    spec:
      project: infrastructure-project
      sources:
        # Helm chart to install rabbitmq
        - path: components/shared/message-broker/rmq-message-broker-chart
          repoURL: 'https://github.com/isisbusapps/gitops'
          targetRevision: main
          helm:
            valueFiles:
             - values.yaml
             - values-httpRoute.yaml
      destination:
        namespace: apps
        name: '{{.name}}'
      syncPolicy:
        automated: 
          selfHeal: true
          enabled: true
