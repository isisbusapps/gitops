apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: rabbitmq-topology-operator
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
  - list:
      elements:
        # Names of clusters to deploy the app to
        - name: prod-v4
        # Uncomment if you want to deploy to prod-fallback
        #- name: prod-fallback
  template:
    metadata:
      name: rabbitmq-topology-operator
      nnotations:
        argocd.argoproj.io/sync-wave: "1"     
    spec:
      project: infrastructure-project
      source:
        path: components/infra/rabbitmq-operators/operators/topology-operator
        repoURL: 'https://github.com/isisbusapps/gitops'
        targetRevision: main
      destination:
        namespace: rabbitmq-system
        name: '{{.name}}'
      syncPolicy:
        automated: 
          selfHeal: true
        syncOptions:
          - ServerSideApply=true   