apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: uop-exchange-topology
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
  - list:
      elements:
        # Names of clusters to deploy the app to
        - name: prod-v4
        - name: prod-fallback
  template:
    metadata:
      name: '{{.name}}-uop-exchange-topology'
      annotations:
        argocd.argoproj.io/sync-wave: "0"        
    spec:
      project: submissions-project
      source:
        path: components/submissions/uop-exchange-topology
        repoURL: 'https://github.com/isisbusapps/gitops'
        targetRevision: main
        helm:
          valueFiles:          
            - ../../shared/message-broker/rmq-message-broker-chart/values.yaml
            - ../../shared/message-broker-admin/message-broker-admin-chart/values-prod.yaml
            - values-prod.yaml
      destination:
        namespace: apps
        name: '{{.name}}'
      syncPolicy:
        automated: 
          selfHeal: true
          enabled: true