apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: user-exchange-client-config-maps
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
  - list:
      elements:
        # Names of clusters to deploy the app to
        - name: prod-v4
        # Uncomment if you want to deploy to prod-fallback
        #- name: prod-fallback
  template:
    metadata:
      name: '{{.name}}-user-exchange-client-config-maps'
      annotations:
        argocd.argoproj.io/sync-wave: "5"        
    spec:
      project: u-a-project
      source:
        path: components/ua/user-exchange-client/user-exchange-client-chart/config-maps/prod
        repoURL: 'https://github.com/isisbusapps/gitops'
        targetRevision: main
        directory:
          recurse: false
      destination:
        namespace: apps
        name: '{{.name}}'
      syncPolicy:
        automated: 
          selfHeal: true