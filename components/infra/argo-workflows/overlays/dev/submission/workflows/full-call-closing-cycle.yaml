# steps 1, 3a, 3b, 3d are core's own logic invoked via GraphQL
# 2 is glue
# 3c is a temporary stand-in for the event bus; 3e documents that fact.

apiVersion: argoproj.io/v1alpha1
kind: CronWorkflow
metadata:
  name: full-call-closing-cycle
  namespace: cron-jobs
spec:
  schedule: "*/5 * * * *"
  timezone: "Europe/London"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 30
  failedJobsHistoryLimit: 3
  successfulJobsHistoryLimit: 3
  workflowSpec:
    serviceAccountName: argo-workflow
    entrypoint: main
    templates:

      # ── Orchestration ──────────────────────────────────────────────────────
      - name: main
        steps:

          # 1. Server-side date filter — Postgres does end_call <= now()
          - - name: get-calls-to-close
              templateRef:
                name: call-graphql
                template: call
                clusterScope: true
              arguments:
                parameters:
                  - name: operation
                    value: "{ calls(filter: { isEnded: true, isCallEndedByEvent: false }) { id shortCode endCall } }"
                  - name: variables
                    value: "{}"
                  - name: secret
                    value: uop-endpoint

          # 2. Unwrap data.calls -> bare JSON array for withParam
          - - name: extract-calls
              templateRef:
                name: node-runner-template
                template: run
                clusterScope: true
              arguments:
                parameters:
                  - name: script
                    value: |
                      const response = JSON.parse(`{{steps.get-calls-to-close.outputs.result}}`);
                      if (response.errors) throw new Error(JSON.stringify(response.errors));
                      console.log(JSON.stringify(response.data?.calls ?? []));

          # 3. Fan out one close-cycle per ended call
          - - name: close-call-cycle
              template: close-call-cycle
              withParam: "{{steps.extract-calls.outputs.result}}"
              arguments:
                parameters:
                  - name: call-id
                    value: "{{item.id}}"
                  - name: short-code
                    value: "{{item.shortCode}}"

          # 4. Summary email, only if anything closed
          - - name: notify
              template: send-email
              arguments:
                parameters:
                  - name: closed-calls
                    value: "{{steps.extract-calls.outputs.result}}"

      # ── Per-call close cycle ───────────────────────────────────────────────
      - name: close-call-cycle
        inputs:
          parameters:
            - name: call-id
            - name: short-code
        steps:

          # 3a. Flip callEnded ONLY — callEndedInternal is a separate
          #     lifecycle with its own deadline (sibling CronWorkflow).
          - - name: end-call
              templateRef:
                name: call-graphql
                template: call
                clusterScope: true
              arguments:
                parameters:
                  - name: operation
                    value: "mutation { updateCall(updateCallInput: { id: {{inputs.parameters.call-id}}, isActive: false, callEnded: true }) { id isActive } }"
                  - name: variables
                    value: "{}"
                  - name: secret
                    value: uop-endpoint

          # 3b. Proposals on the call + workflow connections w/ events.
          #     Field names verified by introspection 14/07/2026:
          #     Workflow.connections (not workflowConnections),
          #     prev/nextWorkflowStatusId (not prev/nextStatusId),
          #     Proposal.workflowStatusId is the matching ID space.
          - - name: get-proposals-and-workflow
              templateRef:
                name: call-graphql
                template: call
                clusterScope: true
              arguments:
                parameters:
                  - name: operation
                    value: "{ proposals(filter: { callId: {{inputs.parameters.call-id}} }) { proposals { primaryKey workflowStatusId } } call(callId: {{inputs.parameters.call-id}}) { proposalWorkflow { connections { id prevWorkflowStatusId nextWorkflowStatusId statusChangingEvents { statusChangingEvent } } } } }"
                  - name: variables
                    value: "{}"
                  - name: secret
                    value: uop-endpoint

          # 3c. DEMO SCAFFOLDING — single-event transition selection.
          #     Reimplements core engine evaluation; deleted under Option A.
          #     Matches on workflowStatusId (per-workflow node IDs), NOT the
          #     global statusId — the two can coincide on dev data and then
          #     misroute in production.
          - - name: compute-transitions
              templateRef:
                name: node-runner-template
                template: run
                clusterScope: true
              arguments:
                parameters:
                  - name: script
                    value: |
                      const response = JSON.parse(`{{steps.get-proposals-and-workflow.outputs.result}}`);
                      if (response.errors) throw new Error(JSON.stringify(response.errors));

                      const proposals = response.data?.proposals?.proposals ?? [];
                      const connections =
                        response.data?.call?.proposalWorkflow?.connections ?? [];

                      // DEMO LIMITATION: the real engine evaluates accumulated
                      // proposal_events; no GraphQL surface exists for those, so
                      // connections requiring CALL_ENDED plus other events are skipped.
                      // Map: prevWorkflowStatusId -> { next, connId }. connId is
                      // required by 3d so changeProposalsStatus fires the
                      // connection's status actions (email/RabbitMQ/download).
                      const transitions = {};
                      let skippedMultiEvent = 0;
                      for (const conn of connections) {
                        const evts = (conn.statusChangingEvents ?? [])
                          .map((e) => e.statusChangingEvent);
                        if (!evts.includes("CALL_ENDED")) continue;
                        if (evts.length === 1) {
                          transitions[conn.prevWorkflowStatusId] = {
                            next: conn.nextWorkflowStatusId,
                            connId: conn.id,
                          };
                        } else {
                          skippedMultiEvent++;
                        }
                      }

                      const batches = {}; // key: `${next}:${connId}`
                      const unmoved = [];
                      for (const p of proposals) {
                        const t = transitions[p.workflowStatusId];
                        if (t) {
                          const key = `${t.next}:${t.connId}`;
                          (batches[key] ??= {
                            workflowStatusId: t.next,
                            connectionId: t.connId,
                            pks: [],
                          }).pks.push(p.primaryKey);
                        } else {
                          unmoved.push(p.primaryKey);
                        }
                      }

                      console.error(
                        `transitions=${JSON.stringify(transitions)} ` +
                        `unmoved=${JSON.stringify(unmoved)} ` +
                        `skippedMultiEventConnections=${skippedMultiEvent}`
                      );
                      console.log(JSON.stringify(
                        Object.values(batches).map((b) => ({
                          workflowStatusId: b.workflowStatusId,
                          connectionId: b.connectionId,
                          proposalPks: JSON.stringify(b.pks),
                        }))
                      ));

          # 3d. Apply transitions batched by (target status, connection).
          #     ChangeProposalsStatusInput verified by introspection:
          #     workflowStatusId: Int!, proposalPks: [Int!]!,
          #     statusActionsWorkflowConnectionId: Int (optional — but REQUIRED
          #     for status actions to fire; proposalStatusActionEngine looks up
          #     actions by this connection id, ProposalMutations.ts:596).
          - - name: change-proposal-statuses
              templateRef:
                name: call-graphql
                template: call
                clusterScope: true
              withParam: "{{steps.compute-transitions.outputs.result}}"
              arguments:
                parameters:
                  - name: operation
                    value: "mutation { changeProposalsStatus(changeProposalsStatusInput: { workflowStatusId: {{item.workflowStatusId}}, proposalPks: {{item.proposalPks}}, statusActionsWorkflowConnectionId: {{item.connectionId}} }) }"
                  - name: variables
                    value: "{}"
                  - name: secret
                    value: uop-endpoint

          # 3e. Fidelity ledger into the Argo run log — bash is enough here
          - - name: report-fidelity
              template: report-fidelity
              arguments:
                parameters:
                  - name: call-id
                    value: "{{inputs.parameters.call-id}}"
                  - name: transitions
                    value: "{{steps.compute-transitions.outputs.result}}"

      # ── Execution templates ────────────────────────────────────────────────
      - name: report-fidelity
        inputs:
          parameters:
            - name: call-id
            - name: transitions
        script:
          image: alpine:3.20
          command: [sh]
          source: |
            cat <<'EOF'
            ── Fidelity report: call {{inputs.parameters.call-id}} ─────────────
            Applied transitions: {{inputs.parameters.transitions}}

            REPLICATED vs real CALL_ENDED event path:
              [x] call_ended flag set                 (updateCall)
              [x] proposal status transitions         (changeProposalsStatus)
              [x] status actions email/RabbitMQ/dl    (statusActionsWorkflowConnectionId
                                                       -> proposalStatusActionEngine,
                                                       ProposalMutations.ts:596)
            NOT REPLICATED (requires Event.CALL_ENDED on internal bus):
              [ ] proposal_events row (call_ended)    -- no GraphQL surface
              [ ] multi-event accumulated transitions -- needs proposal_events
              [ ] transition selection by core engine -- reimplemented in
                  compute-transitions (demo scaffolding, drifts from core)

            Resolution: Option A — endCall mutation with @EventBus(CALL_ENDED)
            deletes steps 3b-3d and restores full fidelity.
            ────────────────────────────────────────────────────────────────
            EOF

      - name: send-email
        inputs:
          parameters:
            - name: closed-calls
        script:
          image: node:20-slim
          command: [node]
          env:
            - name: SMTP_HOST
              valueFrom:
                secretKeyRef: { name: smtp-config, key: host }
            - name: SMTP_PORT
              valueFrom:
                secretKeyRef: { name: smtp-config, key: port }
            - name: MAIL_TO
              valueFrom:
                secretKeyRef: { name: smtp-config, key: to }
          source: |
            // Minimal SMTP client over net — no deps in node:20-slim.
            // Assumes an internal relay (no auth/TLS); swap for an HTTP
            // mail API call if one exists.
            const net = require("net");

            const calls = JSON.parse(`{{inputs.parameters.closed-calls}}`);

            if (calls.length === 0) {
              console.log("No calls closed — nothing to notify.");
              process.exit(0);
            }

            const lines = calls.map(
              (c) => `  - Call ${c.id} (${c.shortCode ?? ""}), ended ${c.endCall ?? ""}`
            );
            const body =
              `Calls closed by full-call-closing-cycle:\r\n\r\n` +
              lines.join("\r\n") +
              `\r\n\r\nSee Argo run logs for per-call fidelity reports.`;

            const from = "argo-workflows@stfc.ac.uk";
            const to = process.env.MAIL_TO;

            const sock = net.connect(
              Number(process.env.SMTP_PORT ?? 25),
              process.env.SMTP_HOST
            );
            const cmds = [
              `HELO argo-workflows`,
              `MAIL FROM:<${from}>`,
              `RCPT TO:<${to}>`,
              `DATA`,
              `From: ${from}\r\nTo: ${to}\r\n` +
                `Subject: [cron-orchestration] ${calls.length} call(s) closed\r\n` +
                `\r\n${body}\r\n.`,
              `QUIT`,
            ];
            let i = 0;
            sock.on("data", (d) => {
              const code = d.toString().slice(0, 3);
              if (code.startsWith("5")) {
                console.error(`SMTP error: ${d}`);
                process.exit(1);
              }
              if (i < cmds.length) sock.write(cmds[i++] + "\r\n");
              else sock.end();
            });
            sock.on("end", () =>
              console.log(`Notified ${to} of ${calls.length} call(s)`)
            );
            sock.on("error", (e) => { console.error(e); process.exit(1); });