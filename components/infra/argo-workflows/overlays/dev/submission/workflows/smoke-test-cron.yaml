apiVersion: argoproj.io/v1alpha1
kind: CronWorkflow
metadata:
  name: smoke-test-cron
  namespace: cron-jobs
spec:
  schedules:
    - "*/5 * * * *" #at every 5th minute
  concurrencyPolicy: Forbid
  # means if a run is still going when the next schedule fires, the new one is skipped rather than running in parallel
  startingDeadlineSeconds: 30
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  workflowSpec:
    entrypoint: main
    serviceAccountName: argo-workflow
    templates:
      - name: main
        steps:
          - - name: smoke-test
              templateRef:
                name: run-container-template
                template: run
                clusterScope: true
              arguments:
                parameters:
                  - name: image
                    value: "alpine:3.19"
                  - name: command
                    value: "echo"
                  - name: args
                    value: "smoke test passed"