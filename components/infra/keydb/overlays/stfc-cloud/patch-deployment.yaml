apiVersion: apps/v1
kind: Deployment
metadata:
  name: keydb
  labels:
    cluster: stfc-cloud
spec:
  selector:
    matchLabels:
      app: keydb
      instance: keydb
  template:
    metadata:
      labels:
        cluster: stfc-cloud
    spec:
      containers:
      - name: keydb
        command:
        - keydb-server
        - /etc/keydb/keydb.conf
        - --requirepass
        - $(KEYDB_PASSWORD)
        - --masterauth
        - $(KEYDB_PASSWORD)
        - --replicaof
        - keydb-isis-vms.apps.svc.cluster.local
        - "6379"
        - --replicaof
        - keydb-proxmox-vms.apps.svc.cluster.local
        - "6379"
