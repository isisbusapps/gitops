apiVersion: apps/v1
kind: Deployment
metadata:
  name: approved-experiments
spec:
  template:
    spec:
      containers:
        - name: approved-experiments
          image: ghcr.io/isisbusapps/approved-experiments@sha256:bcbea961992963644c2813d8328c207d1edf1bd1f31df41d347184085cc18e1e
          envFrom:
            - secretRef:
                name: approved-experiments
          volumeMounts:
            - name: env-config
              mountPath: "/FBS"
              readOnly: true
            - name: common-public
              mountPath: "/app/build/common-public"
              readOnly: true
      volumes:
        - name: common-views
          configMap:
            name: common-pug-views-2026
        - name: common-public
          configMap:
            name: common-pug-public-2026
