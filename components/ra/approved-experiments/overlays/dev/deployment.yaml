apiVersion: apps/v1
kind: Deployment
metadata:
  name: approved-experiments
spec:
  template:
    spec:
      containers:
        - name: approved-experiments
          image: ghcr.io/isisbusapps/approved-experiments@sha256:21f219dc9d731f30e8e9c1233c2205868d5036cc63ab783a247ffacc3e5b9a8e
          envFrom:
            - secretRef:
                name: approved-experiments
          volumeMounts:
            - name: common-public
              mountPath: "/app/build/common-public"
              readOnly: true
      volumes:
        - name: common-views
          configMap:
            name: common-pug-views-2026
        - name: common-public
          configMap:
            name: common-pug-public-2026
