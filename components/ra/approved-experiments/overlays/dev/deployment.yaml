apiVersion: apps/v1
kind: Deployment
metadata:
  name: approved-experiments
spec:
  template:
    spec:
      containers:
        - name: approved-experiments
          image: ghcr.io/isisbusapps/approved-experiments@sha256:852e79d8ed132dc7054f82faec00b61b4a8961f37b13a1aaebe07ee398587422
          envFrom:
            - secretRef:
                name: approved-experiments
          volumeMounts:
            - name: common-public
              mountPath: "/app/build/common-public"
              readOnly: true
      volumes:
        - name: common-views
          configMap:
            name: common-pug-views-2026
        - name: common-public
          configMap:
            name: common-pug-public-2026
