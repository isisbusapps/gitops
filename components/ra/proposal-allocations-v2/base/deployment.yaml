apiVersion: apps/v1
kind: Deployment
metadata:
  name: proposal-allocations-v2
spec:
  replicas: 1
  template:
    spec:
      containers:
        - name: proposal-allocations
          imagePullPolicy: Always
          ports:
            - containerPort: 5050
          volumeMounts:
            - name: spring-config
              mountPath: "/FBS/Apps/spring/proposal-allocations"
              readOnly: true
          readinessProbe:
            httpGet:
              path: /proposal-allocations/v2/actuator/health/readiness
              port: 5050
            initialDelaySeconds: 10
            periodSeconds: 5
      imagePullSecrets:
        - name: registry-creds
