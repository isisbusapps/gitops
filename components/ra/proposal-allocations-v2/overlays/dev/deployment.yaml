apiVersion: apps/v1
kind: Deployment
metadata:
  name: proposal-allocations-v2
spec:
  template:
    spec:
      containers:
        - name: proposal-allocations
          image: ghcr.io/isisbusapps/proposal-allocations@sha256:f4c06312e297c6ba0ab01f7948eeaa7eee2fba51f39129b62cd6ed9cdc813364
          ports:
            - containerPort: 7005
          env:
            - name: APP_ENV
              value: dev
            - name: JAVA_TOOL_OPTIONS
              value: -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=7005 -Dlog4j2.formatMsgNoLookups=true
      volumes:
        - name: spring-config
          secret:
            secretName: proposal-allocations-profiles
