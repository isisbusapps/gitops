apiVersion: apps/v1
kind: Deployment
metadata:
  name: proposal-allocations-v2
spec:
  template:
    spec:
      containers:
        - name: proposal-allocations
          image: ghcr.io/isisbusapps/proposal-allocations@sha256:49df76edc0799dd1f07c0375da6374e925b6c089378ca27e12c6e5d3dff9afc3
          ports:
            - containerPort: 7005
          env:
            - name: APP_ENV
              value: dev
            - name: JAVA_TOOL_OPTIONS
              value: -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=7005 -Dlog4j2.formatMsgNoLookups=true
      volumes:
        - name: spring-config
          secret:
            secretName: proposal-allocations-profiles
