apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: proposal-allocations
  namespace: apps
spec:
  type: kv-v2
  refreshAfter: 30s
  vaultAuthRef: static-auth

  mount: reviews_and_allocations
  path: dev/proposal-allocations
  destination:
    name: proposal-allocations-profiles
    overwrite: true
    create: true
