apiVersion: apps/v1
kind: Deployment
metadata:
  name: request-consumables
spec:
  replicas: 1
  template:
    spec:
      containers:
        - name: request-consumables
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          env:
            - name: CONFIG_PATH
              value: /FBS/.env
          envFrom:
            - secretRef:
                name: request-consumables
          volumeMounts:
            - name: env-config
              mountPath: "/FBS"
              readOnly: true
            - name: common-views
              mountPath: "/app/build/common-views"
              readOnly: true
            - name: common-public
              mountPath: "/app/build/common-public"
              readOnly: true
          readinessProbe:
            httpGet:
              path: /consumables/health/ready
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5
      imagePullSecrets:
        - name: registry-creds
      volumes:
        - name: env-config
          secret:
            secretName: request-consumables-environment
        - name: common-views
          configMap:
            name: common-pug-views-2026
        - name: common-public
          configMap:
            name: common-pug-public-2026
