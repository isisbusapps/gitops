apiVersion: apps/v1
kind: Deployment
metadata:
  name: request-consumables
spec:
  template:
    spec:
      containers:
        - name: request-consumables
          image: ghcr.io/isisbusapps/request-consumables@sha256:fc1d030541df4ee42847703da0f68cbac8d155f91bf059a36e4853a47160a18a
          env:
            - name: NODE_ENV
              value: development
          envFrom:
            - secretRef:
                name: request-consumables
          volumeMounts:
            - name: common-public
              mountPath: "/app/build/common-public"
              readOnly: true
      volumes:
        - name: common-views
          configMap:
            name: common-pug-views-2026
        - name: common-public
          configMap:
            name: common-pug-public-2026