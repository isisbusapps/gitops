apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: request-consumables
  namespace: apps
spec:
  type: kv-v2
  refreshAfter: 30s
  vaultAuthRef: static-auth

  mount: reviews_and_allocations
  path: dev/request-consumables
  destination:
    name: request-consumables
    overwrite: true
    create: true
