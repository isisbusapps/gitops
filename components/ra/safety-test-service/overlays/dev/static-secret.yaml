apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: safety-test-service
  namespace: apps
spec:
  type: kv-v2
  refreshAfter: 30s
  vaultAuthRef: static-auth

  mount: reviews_and_allocations
  path: dev/safety-test-service
  destination:
    name: safety-test-service
    overwrite: true
    create: true