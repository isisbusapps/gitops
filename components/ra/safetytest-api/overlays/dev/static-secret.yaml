apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: safetytest-api
  namespace: apps
spec:
  type: kv-v2
  refreshAfter: 30s
  vaultAuthRef: static-auth

  mount: reviews_and_allocations
  path: dev/safetytest-api
  destination:
    name: safetytest-api
    overwrite: true
    create: true