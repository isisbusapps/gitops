apiVersion: apps/v1
kind: Deployment
metadata:
  name: settings-tool-service
spec:
  replicas: 1
  template:
    spec:
      containers:
        - name: settings-tool-service
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: LOG4J_CONFIGURATION_FILE
              value: /FBS/config/log4j2.xml
          volumeMounts:
            - name: settings-tool-config
              mountPath: "/FBS/config"
              readOnly: true
      imagePullSecrets:
        - name: registry-creds
      volumes:
        - name: settings-tool-config
          secret:
            secretName: settings-tool-config
