apiVersion: apps/v1
kind: Deployment
metadata:
  name: settings-tool-service
spec:
  template:
    spec:
      containers:
        - name: settings-tool-service
          image: ghcr.io/isisbusapps/settings-tool-service@sha256:cd2e5ae6767e8b099b8832f8de80486432809717de790342c328bf07bbb6d99d
          ports:
            - containerPort: 7005
          env:
            - name: JAVA_TOOL_OPTIONS
              value: -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:7005 -Denvironment=dev
