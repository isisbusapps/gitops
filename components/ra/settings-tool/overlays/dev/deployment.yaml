apiVersion: apps/v1
kind: Deployment
metadata:
  name: settings-tool-service
spec:
  template:
    spec:
      containers:
        - name: settings-tool-service
          image: ghcr.io/isisbusapps/settings-tool-service@sha256:1d08f3235eab91bcb363411a42102cdaf9df530d9a683e71e7db43259107f906
          ports:
            - containerPort: 7005
          env:
            - name: JAVA_TOOL_OPTIONS
              value: -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:7005 -Denvironment=dev
