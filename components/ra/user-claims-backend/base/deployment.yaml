apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-claims-backend
spec:
  replicas: 1
  template:
    spec:
      containers:
        - name: user-claims-backend
          imagePullPolicy: Always
          ports:
            - containerPort: 3001
          envFrom:
            - secretRef:
                name: user-claims-backend
          volumeMounts:
            - name: uploads
              mountPath: "/app/uploads"
              readOnly: false
          readinessProbe:
            httpGet:
              path: /user-claims-api/health/ready
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 5
      imagePullSecrets:
        - name: registry-creds
      volumes:
        - name: uploads
          emptyDir: {}
