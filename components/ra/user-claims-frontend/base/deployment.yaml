apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-claims-frontend
spec:
  replicas: 1
  template:
    spec:
      containers:
        - name: user-claims-frontend
          imagePullPolicy: Always
          ports:
            - containerPort: 6011
      imagePullSecrets:
        - name: registry-creds
      volumes:
        - name: env-config
          secret:
            secretName: user-claims-frontend
