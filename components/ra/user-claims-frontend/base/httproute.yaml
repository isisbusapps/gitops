apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: user-claims-frontend
spec:
  parentRefs:
    - name: envoy-gateway
      namespace: envoy-gateway-system
  hostnames:
    - "*.facilities.rl.ac.uk"
    - "*.developers.facilities.rl.ac.uk"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /user-claims
      backendRefs:
        - name: user-claims-frontend
          port: 6011
