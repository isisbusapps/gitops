apiVersion: apps/v1
kind: Deployment
metadata:
  name: manage-consumables-backend
spec:
  replicas: 1
  template:
    metadata:
      annotations:
        co.elastic.logs/processors.add_fields.target: ""
        co.elastic.logs/processors.add_fields.fields.application.name: "manage-consumables-backend"
        co.elastic.logs/processors.add_fields.fields.application.domain: "manage-consumables"
        co.elastic.logs/processors.add_fields.fields.application.tier: web
        co.elastic.logs/processors.add_fields.fields.application.language: "typescript"
        # Extract log_level, class, and log_message as separate fields for elastic
        co.elastic.logs/processors.dissect.tokenizer: "%{?date} %{?time} %{log_level->} %{log_message}"
        co.elastic.logs/processors.dissect.target_prefix: ""
        co.elastic.logs/multiline.pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}"
        co.elastic.logs/multiline.negate: "true"
        co.elastic.logs/multiline.match: "after"
    spec:
      containers:
        - name: manage-consumables-backend
          imagePullPolicy: Always
          ports:
            - containerPort: 4023
          env:
            - name: ANTIVIRUS_HOST
              value: clam-antivirus
            - name: ANTIVIRUS_PORT
              value: "3310"
            - name: OTEL_SERVICE_NAME
              value: "manage-consumables-backend"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://alloy.alloy.svc.cluster.local:4318"
            - name: OTEL_SDK_DISABLED
              value: "FALSE"
            - name: OTEL_LOG_LEVEL
              value: "ERROR"
            - name: NEXT_OTEL_VERBOSE
              value: "1"
          livenessProbe:
            httpGet:
              path: /manage-consumables-service/api/health
              port: 4023
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /manage-consumables-service/api/health
              port: 4023
            initialDelaySeconds: 10
            periodSeconds: 15
          volumeMounts:
            - name: manage-consumables-volume
              mountPath: "/FBS/apps"
              readOnly: true
      imagePullSecrets:
        - name: registry-creds
      volumes:
        - name: manage-consumables-volume
          secret:
            secretName: manage-consumables-config
        - name: uploads
          emptyDir: {}