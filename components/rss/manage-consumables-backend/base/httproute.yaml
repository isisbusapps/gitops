apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: manage-consumables-backend
spec:
  parentRefs:
    - name: envoy-gateway
      namespace: envoy-gateway-system
  hostnames:
    - "*.developers.facilities.rl.ac.uk"
    - "*.facilities.rl.ac.uk"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /manage-consumables-service
      backendRefs:
        - name: manage-consumables-backend
          port: 4023