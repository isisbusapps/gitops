apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: manage-consumables-backend
  namespace: apps
spec:
  type: kv-v2
  refreshAfter: 30s
  vaultAuthRef: static-auth
  mount: risks-sample-and-scheduling
  path: dev/manage-consumables
  destination:
    name: manage-consumables-backend
    overwrite: true
    create: true