apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: schedule-service
  namespace: apps
spec:
  parentRefs:
    - name: envoy-gateway
      namespace: envoy-gateway-system
  hostnames:
    - "*.developers.facilities.rl.ac.uk"
    - "*.facilities.rl.ac.uk"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /ScheduleSessionBeanService/ScheduleSessionBean/health
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /health
      backendRefs:
        - name: schedule-service
          port: 8080
    - matches:
        - path:
            type: PathPrefix
            value: /ScheduleSessionBeanService
      backendRefs:
        - name: schedule-service
          port: 8080