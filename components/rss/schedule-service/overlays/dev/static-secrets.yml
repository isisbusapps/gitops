apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: schedule-service
  namespace: apps
spec:
  type: kv-v2
  refreshAfter: 30s
  vaultAuthRef: static-auth
  mount: risks-sample-and-scheduling
  path: dev/schedule-service
  destination:
    name: schedule-service
    overwrite: true
    create: true