apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $.Values.httpRoute.name }}
  namespace: {{ $.Values.httpRoute.namespace }}
spec:
  parentRefs:
    - name: {{ $.Values.httpRoute.parentRef.name }}
      namespace: {{ $.Values.httpRoute.parentRef.namespace }}
  hostnames:
    - {{ $.Values.httpRoute.hostnames | quote }}
  rules:
    - matches:
        - path:
            type: {{ $.Values.httpRoute.path.type }}
            value: {{ $.Values.httpRoute.path.value }}
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: {{ $.Values.httpRoute.rewrite.path.type }}
              replacePrefixMatch: {{ $.Values.httpRoute.rewrite.path.replacePrefixMatch }}
      backendRefs:
        - name: {{ $.Values.httpRoute.backendRef.name }}
          port: {{ $.Values.httpRoute.backendRef.port }}
