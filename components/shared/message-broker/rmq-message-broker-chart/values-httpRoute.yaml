httpRoute:
  name: rmq-message-broker
  namespace: apps
  parentRef:
    name: envoy-gateway
    namespace: envoy-gateway-system
  hostnames: "*.developers.facilities.rl.ac.uk"
  path:
    type: PathPrefix
    value: /rmq
  rewrite:
    path:
      type: ReplacePrefixMatch
      replacePrefixMatch: ""
  backendRef:
    name: rmq-message-broker
    port: 15672