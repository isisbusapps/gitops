apiVersion: apps/v1
kind: Deployment
metadata:
  name: proposal-factory
spec:
  replicas: 1
  selector:
    matchLabels:
      app: proposal-factory
  template:
    metadata:
      labels:
        app: proposal-factory
        bypass-alloy-scraper: bypass
      annotations:
        co.elastic.logs/processors.add_fields.target: ""
        co.elastic.logs/processors.add_fields.fields.application.name: "proposal-factory"
        co.elastic.logs/processors.add_fields.fields.application.domain: "proposal"
        co.elastic.logs/processors.add_fields.fields.application.tier: "service"
        co.elastic.logs/processors.add_fields.fields.application.language: "javascript"
    spec:
      containers:
        - name: proposal-factory
          imagePullPolicy: Always
          ports:
            - containerPort: 4500
          env:
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://alloy.alloy.svc.cluster.local:4318/v1/traces
            - name: OTEL_EXPORTER_OTLP_METRICS_ENDPOINT
              value: http://alloy.alloy.svc.cluster.local:4318/v1/metrics
            - name: OTEL_EXPORTER_OTLP_LOGS_ENDPOINT
              value: http://alloy.alloy.svc.cluster.local:4318/v1/logs
            - name: DATABASE_CONNECTION_STRING
              valueFrom:
                secretKeyRef:
                  name: proposal-db-connection-string
                  key: connection-string
            - name: HEADER_LOGO_PATH
              value: /config/images/STFC-Logo.png
            - name: DEPENDENCY_CONFIG
              value: stfc
            - name: OTEL_SERVICE_NAME
              value: proposal-factory
            - name: REQUEST_BODY_LIMIT
              value: "500mb"
          resources:
            limits:
              cpu: "2"
              ephemeral-storage: 2Gi
              memory: 3Gi
            requests:
              cpu: 500m
              ephemeral-storage: 1Gi
              memory: 1Gi
          volumeMounts:
            - name: images
              mountPath: "/config/images"
              readOnly: true
          livenessProbe:
            httpGet:
              path: /health-check
              port: 4500
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readiness
              port: 4500
            initialDelaySeconds: 10
            periodSeconds: 3
      volumes:
        - name: images
          configMap:
            name: proposal-images
