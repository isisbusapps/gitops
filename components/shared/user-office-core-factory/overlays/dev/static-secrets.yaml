apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: proposal-db-connection-string
  namespace: apps
spec:
  type: kv-v2
  refreshAfter: 30s
  vaultAuthRef: static-auth

  mount: uop
  path: dev/shared
  destination:
    name: proposal-db-connection-string
    overwrite: true
    create: true
