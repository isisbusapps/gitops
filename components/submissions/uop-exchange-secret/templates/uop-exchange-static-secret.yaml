apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: uop-exchange-secret
  namespace: apps
spec:
  type: kv-v2
  refreshAfter: 30s
  vaultAuthRef: static-auth
  mount: uop
  path: {{ $.Values.env }}/rabbitmq/
  destination:
    name: uop-exchange-secret
    overwrite: true
    create: true
    transformation:
      templates:
        username:
          text: "{{`{{ get .Secrets \"username\" }}`}}"
        password:
          text: "{{`{{ get .Secrets \"password\" }}`}}"

