apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: auth-service
spec:
  parentRefs:
  - name: envoy-gateway
    kind: Gateway
    namespace: envoy-gateway-system
    sectionName: https-facilities
  hostnames:
  - "*.facilities.rl.ac.uk"
  - "*.developers.facilities.rl.ac.uk"
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /auth-service/v0
    backendRefs:
    - name: auth-service
      port: 8080
    filters:
      - type: URLRewrite
        urlRewrite:
          path:
            type: ReplacePrefixMatch
            replacePrefixMatch: /