apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: auth-service-backend-traffic-policy
  namespace: apps
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: auth-service
  timeout:
    http:
      connectionIdleTimeout: 60s
      maxConnectionDuration: 300s
      requestTimeout: 120s
