apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: authenticate-frontend-users
  namespace: apps
spec:
  type: kv-v2
  refreshAfter: 30s
  vaultAuthRef: static-auth

  mount: users-and-auth
  path: dev/authenticate-frontend
  destination:
    name: authenticate-frontend-users
    overwrite: true
    create: true
