apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: authenticate-frontend
spec:
  parentRefs:
  - name: envoy-gateway
    kind: Gateway
    namespace: envoy-gateway-system
    sectionName: https-facilities
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /auth
    backendRefs:
    - name: authenticate-frontend
      port: 3000