apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: apps

resources:
- ../../base
- config.yaml
- static-secrets.yaml

configMapGenerator:
  - name: allowed-redirects
    files:
      - allowed-redirects.json
    options:
      disableNameSuffixHash: true
  - name: internal-redirects
    files:
      - internal-redirects.json
    options:
      disableNameSuffixHash: true

patches:
- path: patch-image.yaml
