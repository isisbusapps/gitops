apiVersion: apps/v1
kind: Deployment
metadata:
  name: authenticate-frontend
spec:
  template:
    spec:
      containers:
        - name: authenticate-frontend
          image: ghcr.io/isisbusapps/authenticate-frontend@sha256:d0272a34a67cfe15196a84358f67dcf5a71d8b356c924248167bb735040f03e2
          volumeMounts:
            - mountPath: /front_end/config/allowed-redirects.json
              name: allowed-redirects
              subPath: allowed-redirects.json
      volumes:
        - name: allowed-redirects
          configMap:
            name: allowed-redirects
