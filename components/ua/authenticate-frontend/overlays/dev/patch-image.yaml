apiVersion: apps/v1
kind: Deployment
metadata:
  name: authenticate-frontend
spec:
  template:
    spec:
      containers:
        - name: authenticate-frontend
          image: ghcr.io/isisbusapps/authenticate-frontend@sha256:52f101fb2a0306ea84cbd42a69983532a9cc3a262271947115ac59c43d1c79c8
          volumeMounts:
            - mountPath: /front_end/config/allowed-redirects.json
              name: allowed-redirects
              subPath: allowed-redirects.json
      volumes:
        - name: allowed-redirects
          configMap:
            name: allowed-redirects
