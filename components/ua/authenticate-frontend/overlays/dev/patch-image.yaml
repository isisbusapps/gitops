apiVersion: apps/v1
kind: Deployment
metadata:
  name: authenticate-frontend
spec:
  template:
    spec:
      containers:
        - name: authenticate-frontend
          image: ghcr.io/isisbusapps/authenticate-frontend@sha256:f4075d50ad28b7d888dc9351a5b6d8c36ed696d0bd52718c64deaadbf856d1ce
          volumeMounts:
            - mountPath: /front_end/config/allowed-redirects.json
              name: allowed-redirects
              subPath: allowed-redirects.json
      volumes:
        - name: allowed-redirects
          configMap:
            name: allowed-redirects
