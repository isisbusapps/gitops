apiVersion: apps/v1
kind: Deployment
metadata:
  name: authenticate-frontend
spec:
  template:
    spec:
      containers:
        - name: authenticate-frontend
          image: ghcr.io/isisbusapps/authenticate-frontend@sha256:778f841535e474fa1c50aa46b34355f163addbc82963b1b665d0f1a672904659
          volumeMounts:
            - mountPath: /front_end/config/allowed-redirects.json
              name: allowed-redirects
              subPath: allowed-redirects.json
          envFrom:
            - configMapRef:
                name: authenticate-frontend-config
            - secretRef:
                name: authenticate-frontend
      volumes:
        - name: allowed-redirects
          configMap:
            name: allowed-redirects
