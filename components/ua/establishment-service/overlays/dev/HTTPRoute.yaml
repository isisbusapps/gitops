apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: establishment-service
spec:
  parentRefs:
  - name: envoy-gateway
    kind: Gateway
    namespace: envoy-gateway-system
    sectionName: https-facilities
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /establishment-service
    backendRefs:
    - name: establishment-service
      port: 8080
    filters:
      - type: URLRewrite
        urlRewrite:
          path:
            type: ReplacePrefixMatch
            replacePrefixMatch: /