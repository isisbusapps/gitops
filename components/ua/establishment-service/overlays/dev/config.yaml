apiVersion: v1
kind: ConfigMap
metadata:
  name: establishment-service-config
  namespace: apps

data:
  application.properties: |-
    #Configrations for db connection
    quarkus.http.port=8080
    quarkus.http.cors.enabled=true
    
    # JWT configuration
    mp.jwt.verify.
    mp.jwt.verify.issuer=auth-service-quarkus
    smallrye.jwt.path.groups=Role

