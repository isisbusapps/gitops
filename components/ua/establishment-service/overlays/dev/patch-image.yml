apiVersion: apps/v1
kind: Deployment
metadata:
  name: establishment-service
spec:
  template:
    spec:
      containers:
        - name: establishment-service
          image: ghcr.io/isisbusapps/establishment-service@sha256:61c67f97fc31985665833e89bba9bde9a36c67cefaa90603ba901735d1ac44e7
          ports:
            - containerPort: 4019
          env:
            - name: JAVA_TOOL_OPTIONS
              value: -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=4019 -Djavax.net.ssl.trustStore=/deployments/cacerts.jks
