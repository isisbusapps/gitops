apiVersion: apps/v1
kind: Deployment
metadata:
  name: mailchimp-webhooks
spec:
  replicas: 1
  revisionHistoryLimit: 3
  template:
    spec:
      containers:
        - name: mailchimp-webhooks
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          volumeMounts:
            - name: spring-config
              mountPath: "/FBS/Apps/spring/mailchimp-webhooks"
              readOnly: true
      volumes:
        - name: spring-config
          secret:
            secretName: mailchimp-webhooks
            items:
              - key: application.properties
                path: application.properties
      imagePullSecrets:
        - name: registry-creds