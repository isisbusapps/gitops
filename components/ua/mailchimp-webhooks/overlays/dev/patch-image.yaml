apiVersion: apps/v1
kind: Deployment
metadata:
  name: mailchimp-webhooks
spec:
  template:
    spec:
      containers:
        - name: mailchimp-webhooks
          image: ghcr.io/isisbusapps/mailchimp-webhooks@sha256:bb2b51ac934107e426ad9ba7488240da90b50e59e7c9aafdc6161247b676330a
          ports:
            - containerPort: 7005
          env:
            - name: APP_ENV
              value: dev
            - name: JAVA_TOOL_OPTIONS
              value: -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=7005
