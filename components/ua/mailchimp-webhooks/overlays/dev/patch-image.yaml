apiVersion: apps/v1
kind: Deployment
metadata:
  name: mailchimp-webhooks
spec:
  template:
    spec:
      containers:
        - name: mailchimp-webhooks
          image: ghcr.io/isisbusapps/mailchimp-webhooks@sha256:f97509286ab892e4cd40c91af61c93f4101c73680d1a77e3f3bedf1ebc3165a3
          ports:
            - containerPort: 7005
          env:
            - name: APP_ENV
              value: dev
            - name: JAVA_TOOL_OPTIONS
              value: -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=7005
