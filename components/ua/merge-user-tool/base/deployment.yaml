apiVersion: apps/v1
kind: Deployment
metadata:
  name: merge-user-tool
spec:
  replicas: 1
  revisionHistoryLimit: 3
  template:
    spec:
      containers:
        - name: merge-user-tool
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: merge-user-tool-config
              mountPath: /FBS/Apps/spring/merge-user-tool
              readOnly: true
      restartPolicy: Always
      imagePullSecrets:
        - name: registry-creds
