apiVersion: apps/v1
kind: Deployment
metadata:
  name: merge-user-tool
spec:
  template:
    spec:
      containers:
        - name: merge-user-tool
          # version: 1.3.1
          image: ghcr.io/isisbusapps/merge-user-tool@sha256:37866215c38fa0d4fea065ae887884f3b40f3222f6156f421ab44f97d7ba9794
          env:
            - name: APP_ENV
              value: prod
      volumes:
        - name: merge-user-tool-config
          secret:
            secretName: merge-user-tool-profiles
            items:
              - key: merge-user-tool-prod.properties
                path: application-prod.properties
              - key: mergeUserConfigProd.json
                path: mergeUserConfigProd.json
