apiVersion: apps/v1
kind: Deployment
metadata:
  name: messages-service
spec:
  replicas: 3
  revisionHistoryLimit: 3
  template:
    spec:
      containers:
        - name: messages-service
          imagePullPolicy: Always
          ports:
            - containerPort: 30000
          startupProbe:
            successThreshold: 1
            failureThreshold: 18
            periodSeconds: 10
            timeoutSeconds: 5
            httpGet:
              path: /q/health/started
              port: 30000
          livenessProbe:
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
            successThreshold: 1
            httpGet:
              path: /q/health/live
              port: 30000
          readinessProbe:
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 2
            successThreshold: 3
            httpGet:
              path: /q/health/ready
              port: 30000
          envFrom:
            - secretRef:
                name: messages
      restartPolicy: Always
      imagePullSecrets:
        - name: registry-creds