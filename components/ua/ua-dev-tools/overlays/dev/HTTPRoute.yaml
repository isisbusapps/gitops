apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ua-dev-tools
  namespace: apps
spec:
  parentRefs:
    - name: envoy-gateway
      namespace: envoy-gateway-system
  hostnames:
    - "*.developers.facilities.rl.ac.uk"
    - "*.facilities.rl.ac.uk"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /ua-dev-tools
      backendRefs:
        - name: ua-dev-tools
          port: 8100