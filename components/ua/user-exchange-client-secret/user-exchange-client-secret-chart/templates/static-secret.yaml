{{- range .Values.client_users.name }}
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: uex-{{ . }}-client-secret
  namespace: apps
spec:
  type: kv-v2
  refreshAfter: 30s
  vaultAuthRef: static-auth
  mount: user-exchange
  path: dev/client/{{ . }}
  destination:
    name: uex-{{ . }}-client-secret
    overwrite: true
    create: true
    transformation:
      templates:
        username:
          text: "{{`{{ get .Secrets \"RABBITMQ_USER\" }}`}}"
        password:
          text: "{{`{{ get .Secrets \"RABBITMQ_PASS\" }}`}}"
---
{{- end }}