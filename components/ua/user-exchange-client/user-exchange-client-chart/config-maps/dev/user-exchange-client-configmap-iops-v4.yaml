apiVersion: v1
data:
  user-exchange-client-config-iops-v4.yaml: |
    exchangeConfig:
      clientName: iops-v4-client
      republishExchange: iops-v4_direct
      pendingQueue: iops-v4_pending
      holdingQueue: iops-v4_holding
      failedQueue: iops-v4_failed
      successQueue: iops-v4_successful
      failReasonsHeader: fail-reasons
      retryCountHeader: retry-count
      maxRetries: 5
    databaseActions:
      merge:
      - sqlStatement: UPDATE CCEXPERIMENTERS SET USERID = TO_NUMBER(:newUser) WHERE USERID = TO_NUMBER(:oldUser)
      - sqlStatement: UPDATE EXPERIMENTER SET USER_ID = TO_NUMBER(:newUser) WHERE USER_ID = TO_NUMBER(:oldUser)
      - sqlStatement: UPDATE NEW_CONSUMABLES_USER SET USER_NUMBER = TO_CHAR(:newUser) WHERE USER_NUMBER = TO_CHAR(:oldUser)
      - sqlStatement: UPDATE PHD_FUNDING SET USER_ID = TO_NUMBER(:newUser) WHERE USER_ID = TO_NUMBER(:oldUser)
kind: ConfigMap
metadata:
  creationTimestamp: null
  name: user-exchange-client-config-iops-v4
