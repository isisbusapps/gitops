apiVersion: v1
data:
  user-exchange-client-config-era.yaml: |
    exchangeConfig:
      clientName: era-client
      republishExchange: era_direct
      pendingQueue: era_pending
      holdingQueue: era_holding
      failedQueue: era_failed
      successQueue: era_successful
      failReasonsHeader: fail-reasons
      retryCountHeader: retry-count
      maxRetries: 5
    databaseActions:
      merge:
      - sqlStatement: UPDATE ERA SET Created_By = TO_CHAR(:newUser) WHERE Created_By = TO_CHAR(:oldUser)
      - sqlStatement: UPDATE ERA SET Modified_By = TO_CHAR(:newUser) WHERE Modified_By = TO_CHAR(:oldUser)
      - sqlStatement: UPDATE FACILITY_USER SET USER_NUMBER = TO_CHAR(:newUser) WHERE USER_NUMBER = TO_CHAR(:oldUser)
kind: ConfigMap
metadata:
  creationTimestamp: null
  name: user-exchange-client-config-era
