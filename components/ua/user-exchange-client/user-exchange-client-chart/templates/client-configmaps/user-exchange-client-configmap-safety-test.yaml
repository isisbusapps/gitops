apiVersion: v1
data:
  user-exchange-client-config-safety-test.yaml: |
    exchangeConfig:
      clientName: safety-test-client
      pendingQueue: safety-test_pending
      holdingQueue: safety-test_holding
      failedQueue: safety-test_failed
      successQueue: safety-test_successful
      failReasonsHeader: fail-reasons
      retryCountHeader: retry-count
      maxRetries: 5
    databaseActions:
      merge:
      - sqlStatement: UPDATE RESULT SET USER_NUMBER = TO_CHAR(:newUser) WHERE USER_NUMBER = TO_CHAR(:oldUser)
kind: ConfigMap
metadata:
  creationTimestamp: null
  name: user-exchange-client-config-safety-test
