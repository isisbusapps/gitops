apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: user-exchange-publisher
  namespace: apps
spec:
  type: kv-v2
  refreshAfter: 30s
  vaultAuthRef: static-auth
  mount: user-exchange
  path: dev/publisher
  destination:
    name: user-exchange-publisher
    overwrite: true
    create: true
