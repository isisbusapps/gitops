apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-office-web-service-v1
spec:
  template:
    spec:
      containers:
        - name: user-office-web-service
          # version: 1.7.2
          image: ghcr.io/isisbusapps/user-office-web-service@sha256:14cc91d5ceda24c734c9e3b7ecb6e0c33d16906b0ac106825686daf9d43ace65
          env:
            - name: JAVA_TOOL_OPTIONS
              value: -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=7005 -Djavax.net.ssl.trustStore=/deployments/cacerts.jks
