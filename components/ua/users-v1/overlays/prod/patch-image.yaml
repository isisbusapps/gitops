apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-office-web-service-v1
spec:
  template:
    spec:
      containers:
        - name: user-office-web-service
          # version: 1.7.0
          image: ghcr.io/isisbusapps/user-office-web-service@sha256:6b67013a79ccf69ee030ac7f60eb57b0db460a88e7e6aacdf355cb8c126d163f
          env:
            - name: JAVA_TOOL_OPTIONS
              value: -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=7005 -Djavax.net.ssl.trustStore=/deployments/cacerts.jks
