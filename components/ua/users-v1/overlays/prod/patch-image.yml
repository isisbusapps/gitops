apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-office-web-service-v1
spec:
  template:
    spec:
      containers:
        - name: user-office-web-service
          # version: 1.6.1
          image: ghcr.io/isisbusapps/user-office-web-service@sha256:7dd49507b21c57cb5bae11e78b84b69a09c8ce742dd6080c3f8ad921023ba8af
          env:
            - name: JAVA_TOOL_OPTIONS
              value: -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=7005 -Djavax.net.ssl.trustStore=/deployments/cacerts.jks
