apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-office-web-service-v1
spec:
  template:
    spec:
      containers:
        - name: user-office-web-service
          # version: 1.6.0
          image: ghcr.io/isisbusapps/user-office-web-service@sha256:188672920dab2f58e68f2f662775aafefe53ccf5d150b3d6b6a308297c58c4ec
          env:
            - name: JAVA_TOOL_OPTIONS
              value: -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=7005 -Djavax.net.ssl.trustStore=/deployments/cacerts.jks
