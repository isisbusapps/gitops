apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-office-web-service-v2
spec:
  template:
    spec:
      initContainers:
        - name: db-updater
          image: ghcr.io/isisbusapps/users-db-updater@sha256:8861fd4e68a643e7d81998e78963e328583eb332ac540b4e3ab61c7d9471f936
          args: ["update"]
          env:
            - name: LIQUIBASE_COMMAND_URL
              valueFrom:
                secretKeyRef:
                  name: user-office-web-service-v2
                  key: DB_URL
            - name: LIQUIBASE_COMMAND_USERNAME
              valueFrom:
                secretKeyRef:
                  name: user-office-web-service-v2
                  key: DB_USERNAME
            - name: LIQUIBASE_COMMAND_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: user-office-web-service-v2
                  key: DB_PASSWORD
            - name: DEPLOYMENT_NAME
              value: "users-v2-prod"
            - name: AUTHOR
              value: "kubernetes"
          volumeMounts:
            - name: liquibase-config
              mountPath: /liquibase/liquibase.docker.properties
              subPath: liquibase.docker.properties
              readOnly: true
      volumes:
        - name: liquibase-config
          configMap:
            name: users-db-updater-config
      containers:
        - name: user-office-web-service
          # version: 2.8.0
          image: ghcr.io/isisbusapps/user-office-web-service@sha256:5ba668f9c9427c8a9137052604f7f831a8f983fc17c634d971228ee75bd6ae6d
          env:
            - name: JAVA_TOOL_OPTIONS
              value: -Djavax.net.ssl.trustStore=/deployments/cacerts.jks
