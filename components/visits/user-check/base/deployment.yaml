apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-check
spec:
  replicas: 1
  template:
    metadata:
      annotations:
        co.elastic.logs/processors.add_fields.target: ""
        co.elastic.logs/processors.add_fields.fields.application.name: "user-check"
        co.elastic.logs/processors.add_fields.fields.application.domain: "user-check"
        co.elastic.logs/processors.add_fields.fields.application.tier: web
        co.elastic.logs/processors.add_fields.fields.application.language: "typescript"
        # Extract log_level, class, and log_message as separate fields for elastic
        co.elastic.logs/processors.dissect.tokenizer: "%{?date} %{?time} %{log_level->} %{log_message}"
        co.elastic.logs/processors.dissect.target_prefix: ""
        co.elastic.logs/multiline.pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}"
        co.elastic.logs/multiline.negate: "true"
        co.elastic.logs/multiline.match: "after"
    spec:
      containers:
        - name: user-check
          imagePullPolicy: Always
          ports:
            - containerPort: 6005
          env:
            - name: OTEL_SERVICE_NAME
              value: "usercheck-frontend"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://alloy.alloy.svc.cluster.local:4318"
            - name: OTEL_SDK_DISABLED
              value: "FALSE"
            - name: OTEL_LOG_LEVEL
              value: "ERROR"
            - name: NEXT_OTEL_VERBOSE
              value: "1"
          readinessProbe:
            httpGet:
              path: /user-check/ready
              port: 6005
            initialDelaySeconds: 2
            periodSeconds: 3
          livenessProbe:
            httpGet:
              path: /user-check/ready
              port: 6005
            initialDelaySeconds: 1
            periodSeconds: 5
            failureThreshold: 6
          volumeMounts:
            - name: user-check-config
              mountPath: "/FBS/config"
              readOnly: true
      imagePullSecrets:
        - name: registry-creds
      volumes:
        - name: user-check-config
          secret:
            secretName: user-check-config

