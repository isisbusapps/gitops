apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: visits-frontend
spec:
  parentRefs:
    - name: envoy-gateway
      namespace: envoy-gateway-system
  hostnames:
    - "*.developers.facilities.rl.ac.uk"
    - "*.facilities.rl.ac.uk"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /visits-alpha
      backendRefs:
        - name: visits-frontend
          port: 6003
