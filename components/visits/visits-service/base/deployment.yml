apiVersion: apps/v1
kind: Deployment
metadata:
  name: visits-service
spec:
  replicas: 1
  revisionHistoryLimit: 3
  template:
    metadata:
      annotations:
        # Extract details from and add metadata to the logs for use in the central log server
        co.elastic.logs/processors.add_fields.target: ""
        co.elastic.logs/processors.add_fields.fields.application.name: "visits-service"
        co.elastic.logs/processors.add_fields.fields.application.domain: "visits"
        co.elastic.logs/processors.add_fields.fields.application.tier: "service"
        co.elastic.logs/processors.add_fields.fields.application.language: "java"
        # Remove ANSI colour codes. Their inclusion in Payara logs and the [ they contain messes up the dissect pattern.
        co.elastic.logs/processors.1.script.lang: "javascript"
        co.elastic.logs/processors.1.script.source: >
          function process(event) {
            event.Put("message", event.Get("message").replace(/\x1B\[[0-9;]{1,4}m/g, ""))
          }
        # Extract log_level, class, and log_message as separate fields for elastic from app log4j entries
        co.elastic.logs/processors.2.dissect.tokenizer: "%{?date} %{?time} %{log_level->} [%{class}] %{log_message}"
        co.elastic.logs/processors.2.dissect.target_prefix: ""
        co.elastic.logs/processors.2.dissect.ignore_failure: "true"
        co.elastic.logs/processors.2.dissect.trim_values: "all"
        # Extract web method call time data as separate fields for elastic
        co.elastic.logs/processors.3.dissect.when.equals.class: "uk.stfc.visits.model.session.interceptors.AccessLogger"
        co.elastic.logs/processors.3.dissect.tokenizer: "Call to %{web_method.name} exited (%{?status}) in %{web_method.seconds_taken|double} seconds"
        co.elastic.logs/processors.3.dissect.target_prefix: ""
        co.elastic.logs/processors.3.dissect.field: "log_message"
        co.elastic.logs/processors.3.dissect.ignore_failure: "true"
        # Extract REST method call and response data as fields for elastic
        co.elastic.logs/processors.4.dissect.when.equals.class: "uk.ac.rl.facilities.visits.filters.ResponseLoggingFilter"
        co.elastic.logs/processors.4.dissect.tokenizer: "%{rest_request.http_method} %{rest_request.path} (%{rest_request.service_method}) responded %{rest_request.status_code} in %{rest_request.seconds_taken|double} seconds"
        co.elastic.logs/processors.4.dissect.target_prefix: ""
        co.elastic.logs/processors.4.dissect.field: "log_message"
        co.elastic.logs/processors.4.dissect.ignore_failure: "true"

        co.elastic.logs/multiline.pattern: '^\[?[0-9]{4}-[0-9]{2}-[0-9]{2}'
        co.elastic.logs/multiline.negate: "true"
        co.elastic.logs/multiline.match: "after"
    spec:
      containers:
        - name: visits-service
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: LOG4J_CONFIGURATION_FILE
              value: /FBS/config/log4j2.xml
          volumeMounts:
            - name: visits-service-config
              mountPath: "/deployments/.env"
              subPath: ".env"
              readOnly: true
          readinessProbe:
            httpGet:
              path: /visits-service/quarkus/health
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 2
      imagePullSecrets:
        - name: registry-creds
      volumes:
        - name: visits-service-config
          secret:
            secretName: visits-service-config
